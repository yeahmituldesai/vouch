name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vouch
          POSTGRES_PASSWORD: vouch
          POSTGRES_DB: vouch_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: cd server && npm ci
      - run: cd server && cp .env.test .env.test.local 2>/dev/null; true
      - name: Migrate test db
        env:
          NODE_ENV: test
          DATABASE_URL: postgres://vouch:vouch@127.0.0.1:5432/vouch_test
          DATABASE_SSL: false
        run: cd server && npm run migrate 2>/dev/null || true
      - name: Typecheck
        run: cd server && npm run typecheck
      # PAYMENTS_ENABLED is set per suite on purpose. Node's --env-file never
      # overrides an existing process env var, so a job-wide value would leak
      # into the beta suite and make it test the wrong mode.
      - name: Tests (payments enabled)
        env:
          NODE_ENV: test
          PAYMENTS_ENABLED: "true"
          PORT: "0"
          DATABASE_URL: postgres://vouch:vouch@127.0.0.1:5432/vouch_test
          DATABASE_SSL: "false"
          JWT_SECRET: test-secret-test-secret-test-secret-12
          OTP_PEPPER: test-pepper-test-pepper
          CORS_ORIGINS: "*"
          SMS_PROVIDER: console
          PAYMENT_PROVIDER: mock
          ADMIN_TOKEN: test-admin-token-1234
          MAX_LIVE_IDEAS: "5"
          REVIEW_PHONE: "9000000999"
          REVIEW_CODE: "424242"
          SETTLEMENT_INTERVAL_MS: "0"
        run: cd server && npm run test:payments
      - name: Tests (beta mode)
        env:
          NODE_ENV: test
          PAYMENTS_ENABLED: "false"
          PORT: "0"
          DATABASE_URL: postgres://vouch:vouch@127.0.0.1:5432/vouch_test
          DATABASE_SSL: "false"
          JWT_SECRET: test-secret-test-secret-test-secret-12
          OTP_PEPPER: test-pepper-test-pepper
          CORS_ORIGINS: "*"
          SMS_PROVIDER: console
          PAYMENT_PROVIDER: mock
          ADMIN_TOKEN: test-admin-token-1234
          MAX_LIVE_IDEAS: "5"
          REVIEW_PHONE: "9000000999"
          REVIEW_CODE: "424242"
          SETTLEMENT_INTERVAL_MS: "0"
        run: cd server && npm run test:beta

  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: cd mobile && npm ci
      - run: cd mobile && npm run typecheck
      # Android-only beta: the iOS export is not part of the shipped target.
      - run: cd mobile && npx expo export --platform android