name: Keep API awake

on:
  schedule:
    # Render's free tier sleeps after 15 minutes of inactivity and Supabase
    # pauses after 7 days without queries. A ping every 10 minutes keeps the
    # beta API warm and the database active.
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 60 https://vouch-api-9fpi.onrender.com/health)
            echo "attempt $i -> $code"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 20
          done
          exit 1
