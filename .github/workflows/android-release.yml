name: Android release

# Builds the committed native Android project (mobile/android). This workflow
# deliberately does NOT run `expo prebuild`: native changes such as the release
# signing config are source-controlled. See docs/BUILD_ANDROID.md.

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "versionName for this APK (e.g. beta-4 or 1.2.3). Leave empty to use mobile/android/app/build.gradle."
        required: false
        default: ""
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write # required to attach vouch-beta.apk to a GitHub release

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      # Used by the step conditions below; an absent secret evaluates to "".
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      # Public Expo client values, not secrets. Repo variables override these
      # defaults (Settings > Secrets and variables > Actions > Variables).
      EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL || 'https://vouch-api-9fpi.onrender.com' }}
      EXPO_PUBLIC_WEB_URL: ${{ vars.EXPO_PUBLIC_WEB_URL || 'https://vouch-api-9fpi.onrender.com' }}
      EXPO_PUBLIC_GOOGLE_CLIENT_ID: ${{ vars.EXPO_PUBLIC_GOOGLE_CLIENT_ID || '700553469092-3l4c5l5jloa2rh7137eoespdo9vadof8.apps.googleusercontent.com' }}
      EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID: ${{ vars.EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID || '700553469092-aaa23m9jhjtf2a95m25qp7aiu6vi79b3.apps.googleusercontent.com' }}
      EXPO_PUBLIC_SENTRY_DSN: ${{ vars.EXPO_PUBLIC_SENTRY_DSN || 'https://eb6a67bf12ea3b6d091840d1b0db45fa@o4512440660983808.ingest.us.sentry.io/4512440671076352' }}
      EXPO_NO_TELEMETRY: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Fail clearly if the native project ever falls out of git again instead
      # of letting Gradle die with "gradlew: No such file or directory".
      - name: Verify native Android project is present
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          if [ ! -f mobile/android/gradlew ]; then
            echo "::error file=mobile/android/gradlew::mobile/android/gradlew is missing from the checkout."
            missing=1
          fi
          if [ ! -f mobile/android/app/build.gradle ]; then
            echo "::error file=mobile/android/app/build.gradle::mobile/android/app/build.gradle is missing from the checkout."
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            echo ""
            echo "The React Native Android project is source-controlled and must be committed."
            echo "The old setup gitignored mobile/android; CI no longer runs 'expo prebuild'."
            echo "Fix the ignore rules and commit the native project. See docs/BUILD_ANDROID.md."
            exit 1
          fi
          echo "Native Android project present."

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install JS dependencies
        working-directory: mobile
        run: npm ci

      # Tag builds use the tag name (v1.2.3 -> 1.2.3); manual runs may pass an
      # explicit versionName. versionCode is never derived here: bump it in
      # mobile/android/app/build.gradle before tagging.
      - name: Resolve version name
        shell: bash
        env:
          INPUT_VERSION_NAME: ${{ inputs.version_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version_name=""
          if [ -n "${INPUT_VERSION_NAME:-}" ]; then
            version_name="$INPUT_VERSION_NAME"
          elif [ "$REF_TYPE" = "tag" ]; then
            version_name="${REF_NAME#v}"
          fi
          if [ -n "$version_name" ] && ! [[ "$version_name" =~ ^[A-Za-z0-9._-]{1,64}$ ]]; then
            echo "::error::Invalid version name '$version_name'. Use 1-64 characters from A-Z a-z 0-9 . _ -"
            exit 1
          fi
          echo "VOUCH_VERSION_NAME=$version_name" >> "$GITHUB_ENV"
          echo "Resolved versionName: ${version_name:-<from build.gradle>}"

      - name: Apply version name override
        if: ${{ env.VOUCH_VERSION_NAME != '' }}
        shell: bash
        run: |
          set -euo pipefail
          gradle_file=mobile/android/app/build.gradle
          count=$(grep -cE 'versionName[[:space:]]+"[^"]*"' "$gradle_file" || true)
          if [ "$count" -ne 1 ]; then
            echo "::error file=$gradle_file::Expected exactly one versionName entry, found $count."
            exit 1
          fi
          sed -i -E "s/versionName[[:space:]]+\"[^\"]*\"/versionName \"$VOUCH_VERSION_NAME\"/" "$gradle_file"
          grep -n 'versionName' "$gradle_file"

      # Decodes the upload keystore only when the owner configured it. The file
      # lives under the gitignored mobile/android/app/ and never enters git.
      - name: Prepare upload keystore from secret
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          keystore=mobile/android/app/release.keystore

          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "VOUCH_SIGNED=false" >> "$GITHUB_ENV"
            echo "::warning title=Debug-signed release build::ANDROID_KEYSTORE_BASE64 is not set. This run produces a throwaway debug-signed APK that cannot update an existing install. Do not distribute it."
            exit 0
          fi

          missing=""
          for name in ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              missing="$missing $name"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error title=Incomplete signing configuration::ANDROID_KEYSTORE_BASE64 is set but these secrets are missing or empty:$missing"
            exit 1
          fi

          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '\r\n\t ' | base64 -d > "$keystore"
          chmod 600 "$keystore"

          size=$(wc -c < "$keystore")
          if [ "$size" -lt 100 ]; then
            echo "::error title=Invalid keystore::Decoded $keystore is only ${size} bytes. ANDROID_KEYSTORE_BASE64 does not look like a base64-encoded keystore."
            exit 1
          fi

          echo "VOUCH_SIGNED=true" >> "$GITHUB_ENV"
          echo "Decoded upload keystore to $keystore (${size} bytes)."

      # The repository intentionally does not commit debug.keystore. Without an
      # upload keystore, assembleRelease still needs one for its debug fallback.
      - name: Generate throwaway debug keystore
        if: ${{ env.VOUCH_SIGNED != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          debug_keystore=mobile/android/app/debug.keystore
          if [ -f "$debug_keystore" ]; then
            echo "Reusing existing $debug_keystore."
            exit 0
          fi
          keytool -genkeypair -v \
            -storetype PKCS12 \
            -keystore "$debug_keystore" \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"
          chmod 600 "$debug_keystore"
          echo "::warning title=Debug-signed APK::Generated a throwaway debug keystore at $debug_keystore. This artifact is for smoke testing only and cannot update an existing install."

      - name: Build release APK
        working-directory: mobile/android
        shell: bash
        env:
          NODE_ENV: production
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x ./gradlew

          gradle_args=(assembleRelease --no-daemon)
          if [ "${VOUCH_SIGNED:-false}" = "true" ]; then
            store_file="$GITHUB_WORKSPACE/mobile/android/app/release.keystore"
            gradle_args+=(
              "-PVOUCH_UPLOAD_STORE_FILE=$store_file"
              "-PVOUCH_UPLOAD_STORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD"
              "-PVOUCH_UPLOAD_KEY_ALIAS=$ANDROID_KEY_ALIAS"
              "-PVOUCH_UPLOAD_KEY_PASSWORD=$ANDROID_KEY_PASSWORD"
            )
            echo "Building with the upload keystore."
          else
            echo "::warning title=Debug-signed release build::No upload keystore; signing with the generated debug keystore."
          fi

          ./gradlew "${gradle_args[@]}"

      # ABI splits are enabled in app/build.gradle, so the install-anywhere
      # artifact is app-universal-release.apk (fallback covers a splits-free build).
      - name: Verify APK and write job summary
        shell: bash
        run: |
          set -euo pipefail
          apk_dir=mobile/android/app/build/outputs/apk/release
          universal="$apk_dir/app-universal-release.apk"
          plain="$apk_dir/app-release.apk"

          if [ -f "$universal" ]; then
            built_apk="$universal"
          elif [ -f "$plain" ]; then
            built_apk="$plain"
          else
            echo "::error::No release APK found in $apk_dir (looked for app-universal-release.apk and app-release.apk)."
            ls -la "$apk_dir" || true
            exit 1
          fi

          apk="$apk_dir/vouch-beta.apk"
          cp "$built_apk" "$apk"

          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$sdk" ] || [ ! -d "$sdk/build-tools" ]; then
            echo "::error::Android SDK build-tools not found (ANDROID_HOME='$sdk')."
            exit 1
          fi
          build_tools=$(find "$sdk/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)
          aapt="$build_tools/aapt"
          apksigner="$build_tools/apksigner"
          if [ ! -x "$aapt" ] || [ ! -x "$apksigner" ]; then
            echo "::error::aapt/apksigner not found under $build_tools."
            exit 1
          fi

          badging=$("$aapt" dump badging "$apk")
          package=$(printf '%s\n' "$badging" | sed -n "s/^package: name='\([^']*\)'.*/\1/p" | head -n1)
          version_code=$(printf '%s\n' "$badging" | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p" | head -n1)
          version_name=$(printf '%s\n' "$badging" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p" | head -n1)
          if [ -z "$package" ] || [ -z "$version_code" ] || [ -z "$version_name" ]; then
            echo "::error::Could not read package metadata with aapt."
            printf '%s\n' "$badging"
            exit 1
          fi

          certs=$("$apksigner" verify --print-certs "$apk" 2>&1 || true)
          signer_dn=$(printf '%s\n' "$certs" | sed -n 's/^Signer #1 certificate DN: //p' | head -n1)
          cert_sha256=$(printf '%s\n' "$certs" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n1)
          if [ -z "$signer_dn" ]; then
            echo "::error title=Unsigned APK::apksigner produced no signer certificate for $apk."
            printf '%s\n' "$certs"
            exit 1
          fi

          if printf '%s' "$signer_dn" | grep -qi 'Android Debug'; then
            signing_mode="debug (throwaway)"
            if [ "${VOUCH_SIGNED:-false}" = "true" ]; then
              echo "::error title=Wrong signer::ANDROID_KEYSTORE_BASE64 is set but the APK is signed with the Android debug key. The release signing config did not receive the VOUCH_UPLOAD_* properties."
              exit 1
            fi
            echo "::warning title=Debug-signed APK::The APK is debug-signed and cannot update an existing install. Do not distribute it."
          else
            signing_mode="upload keystore"
          fi

          apk_sha256=$(sha256sum "$apk" | cut -d' ' -f1)
          apk_bytes=$(wc -c < "$apk")
          apk_size=$(numfmt --to=iec "$apk_bytes")

          {
            echo "## Vouch Android APK"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Package | \`$package\` |"
            echo "| versionCode | \`$version_code\` |"
            echo "| versionName | \`$version_name\` |"
            echo "| Signer DN | \`$signer_dn\` |"
            echo "| Signer cert SHA-256 | \`$cert_sha256\` |"
            echo "| APK SHA-256 | \`$apk_sha256\` |"
            echo "| Size | $apk_size |"
            echo "| Signing | $signing_mode |"
            echo "| Source APK | \`$(basename "$built_apk")\` |"
            echo "| Commit | \`$GITHUB_SHA\` |"
            echo ""
            if [ "${VOUCH_SIGNED:-false}" != "true" ]; then
              echo "> **Warning:** this artifact is debug-signed. It cannot update an existing install. Configure the signing secrets before distributing it."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          {
            echo "Vouch Android beta build."
            echo ""
            echo "- versionName: \`$version_name\`"
            echo "- versionCode: \`$version_code\`"
            echo "- Signing: $signing_mode"
            echo ""
            if [ "${VOUCH_SIGNED:-false}" != "true" ]; then
              echo "> **Warning:** debug-signed build. It cannot update an existing install. Do not distribute."
            fi
          } > "$RUNNER_TEMP/release-notes.md"

          echo "Verified $apk ($apk_size)"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: vouch-beta-apk
          path: mobile/android/app/build/outputs/apk/release/vouch-beta.apk
          if-no-files-found: error
          retention-days: 30

      - name: Attach APK to GitHub release
        if: ${{ github.ref_type == 'tag' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Vouch ${{ github.ref_name }}
          body_path: ${{ runner.temp }}/release-notes.md
          files: mobile/android/app/build/outputs/apk/release/vouch-beta.apk
          fail_on_unmatched_files: true
