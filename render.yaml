# One-click deploy on Render: https://render.com/docs/blueprint-spec
databases:
  - name: vouch-db
    plan: basic-256mb
    region: singapore
services:
  - type: web
    name: vouch-api
    runtime: docker
    rootDir: server
    region: singapore
    plan: starter
    healthCheckPath: /health
    envVars:
      - { key: NODE_ENV, value: production }
      - { key: DATABASE_URL, fromDatabase: { name: vouch-db, property: connectionString } }
      - { key: JWT_SECRET, generateValue: true }
      - { key: OTP_PEPPER, generateValue: true }
      - { key: ADMIN_TOKEN, generateValue: true }
      - { key: SMS_PROVIDER, value: msg91 }
      - { key: PAYMENT_PROVIDER, value: razorpay }
      - { key: CORS_ORIGINS, value: "https://vouch-api.onrender.com" }
      - { key: MSG91_AUTH_KEY, sync: false }
      - { key: MSG91_TEMPLATE_ID, sync: false }
      - { key: RAZORPAY_KEY_ID, sync: false }
      - { key: RAZORPAY_KEY_SECRET, sync: false }
      - { key: RAZORPAY_WEBHOOK_SECRET, sync: false }
  - { key: GOOGLE_CLIENT_ID, sync: false }
  - { key: DATABASE_SSL, value: "true" }
