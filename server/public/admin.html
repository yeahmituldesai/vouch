<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vouch Admin</title><style>body{font:15px/1.5 -apple-system,Inter,Helvetica,Arial,sans-serif;background:#000;color:#e5e5e7;max-width:900px;margin:0 auto;padding:24px}h1{color:#fff}input,button{font:inherit;padding:8px 12px;border-radius:8px;border:1px solid #333;background:#111;color:#fff}button{cursor:pointer;background:#fff;color:#000;border:none}table{width:100%;border-collapse:collapse;margin-top:16px}th,td{padding:8px;border-bottom:1px solid #222;text-align:left;font-size:13px}a{color:#fff}.row{display:flex;gap:8px;align-items:center;margin:8px 0;flex-wrap:wrap}.card{background:#111;border:1px solid #222;border-radius:12px;padding:16px;margin:12px 0}</style></head><body><h1>Vouch Admin</h1><p style="color:#8e8e93;font-size:13px">Moderation console. Token is kept in this tab only.</p><div class="row"><input id="token" type="password" placeholder="x-admin-token" style="flex:1;min-width:240px"><button onclick="save()">Save token</button><button onclick="load()">Refresh</button></div><div id="status" style="color:#8e8e93;font-size:13px"></div><div class="card"><h2 style="margin:0 0 8px">Reports</h2><div id="reports">loading…</div></div><script>const base=location.origin;let T=sessionStorage.getItem('adminToken')||'';document.getElementById('token').value=T;function save(){T=document.getElementById('token').value;sessionStorage.setItem('adminToken',T);load();}async function api(p,o={}){const r=await fetch(base+'/api/v1'+p,{...o,headers:{'content-type':'application/json','x-admin-token':T,...(o.headers||{})}});const j=await r.json().catch(()=>null);if(!r.ok)throw new Error((j&&j.error&&j.error.message)||r.status);return j;}async function load(){if(!T){document.getElementById('status').textContent='Enter admin token first.';return;}document.getElementById('status').textContent='Loading…';try{const r=await api('/admin/reports');const rows=r.reports||r||[];let h='<table><tr><th>Reports</th><th>Idea</th><th>Reasons</th><th></th></tr>';(Array.isArray(rows)?rows:[]).forEach(x=>{h+=`<tr><td>${x.reports}</td><td><a href="/i/${x.idea_id}">${x.name||x.idea_id}</a> (${x.status})</td><td>${(x.reasons||[]).join(', ')}</td><td><button onclick="remove('${x.idea_id}')">Remove idea</button></td></tr>`;});h+='</table>';document.getElementById('reports').innerHTML=h||'No reports.';document.getElementById('status').textContent='Loaded.';}catch(e){document.getElementById('status').textContent='Error: '+e.message;}}async function remove(id){if(!confirm('Remove this idea and refund buyers?'))return;try{await api('/api/v1/admin/ideas/'+id+'/remove',{method:'POST',body:JSON.stringify({reason:'moderation'})});alert('Removed.');load();}catch(e){alert(e.message);}}load();</script></body></html>
